name: starter_app
description: Flutter starter with Signals, Riverpod, and Supabase.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.11.0 <4.0.0'
  flutter: '>=3.41.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.0
  signals_flutter: ^7.1.0
  flutter_riverpod: ^3.3.1
  flutter_dotenv: ^6.0.1
  supabase_flutter: 2.18.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  default-flavor: local
  uses-material-design: true
  generate: true
  assets:
    - env/.env.local
    - env/.env.dev
    - env/.env.prod
